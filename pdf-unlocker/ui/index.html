<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 权限解锁工具</title>
<style>
  :root {
    --bg: #17191f;
    --panel: #1f222b;
    --panel2: #262a35;
    --border: #333847;
    --text: #e6e9f0;
    --text-dim: #8b92a3;
    --accent: #5b8cff;
    --accent-hover: #4a7bf0;
    --green: #34c07c;
    --amber: #e8a33d;
    --red: #e05a5a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 18px 24px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #7c5bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; }
  header .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  header .spacer { flex: 1; }
  button {
    border: none; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-size: 13px;
    padding: 8px 16px;
    transition: background .15s, opacity .15s;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; font-weight: 500; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { background: #2e3342; }
  .btn-sm { padding: 5px 12px; font-size: 12px; }

  main {
    flex: 1;
    margin: 8px 24px 0;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    overflow-y: auto;
    transition: border-color .15s, background .15s;
  }
  main.dragover { border-color: var(--accent); background: rgba(91,140,255,.06); }

  #empty {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; color: var(--text-dim);
  }
  #empty .icon { font-size: 44px; opacity: .5; }
  #empty .big { font-size: 15px; color: var(--text); }
  #empty .small { font-size: 12.5px; line-height: 1.7; text-align: center; }

  #list { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .row1 { display: flex; align-items: center; gap: 10px; }
  .card .fname {
    font-weight: 500; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .fsize { color: var(--text-dim); font-size: 12px; flex-shrink: 0; }
  .card .row1 .spacer { flex: 1; }
  .badge {
    font-size: 11.5px; padding: 3px 9px; border-radius: 20px; flex-shrink: 0;
    background: rgba(232,163,61,.14); color: var(--amber);
    border: 1px solid rgba(232,163,61,.3);
  }
  .badge.ok { background: rgba(52,192,124,.12); color: var(--green); border-color: rgba(52,192,124,.3); }
  .badge.gray { background: var(--panel2); color: var(--text-dim); border-color: var(--border); }
  .badge.red { background: rgba(224,90,90,.12); color: var(--red); border-color: rgba(224,90,90,.3); }
  .meta { color: var(--text-dim); font-size: 12px; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 11.5px; padding: 3px 9px; border-radius: 5px;
    background: rgba(224,90,90,.1); color: var(--red);
    border: 1px solid rgba(224,90,90,.22);
  }
  .chip.pw { background: rgba(91,140,255,.1); color: var(--accent); border-color: rgba(91,140,255,.25); }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .cbx { display: flex; align-items: center; flex-shrink: 0; }
  .cbx input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .result-path {
    font-size: 12px; color: var(--green);
    word-break: break-all; line-height: 1.5; margin-top: 10px;
  }
  .err { color: var(--red); font-size: 12px; margin-top: 10px; line-height: 1.5; }
  .pw-row { display: flex; gap: 8px; margin-top: 10px; }
  .pw-row input {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 7px;
    color: var(--text); padding: 6px 10px; font-size: 13px; width: 200px;
    font-family: inherit; outline: none;
  }
  .pw-row input:focus { border-color: var(--accent); }
  .spin {
    display: inline-block; width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,.25); border-top-color: #fff;
    border-radius: 50%; animation: r .7s linear infinite; vertical-align: -2px;
  }
  @keyframes r { to { transform: rotate(360deg); } }

  footer {
    flex-shrink: 0;
    padding: 12px 24px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  footer .hint { color: var(--text-dim); font-size: 12px; }
  footer .spacer { flex: 1; }
</style>
</head>
<body>
  <header>
    <div class="logo">🔓</div>
    <div>
      <h1>PDF 权限解锁工具</h1>
      <div class="sub">去除打印 / 复制 / 编辑等权限限制 · 原文件保持不动 · 解锁副本另存</div>
    </div>
  </header>

  <main id="dropzone">
    <div id="empty">
      <div class="icon">📄</div>
      <div class="big">把 PDF 拖到窗口任意位置，或点击右下角「选择文件」</div>
      <div class="small">支持批量 · 仅解除「权限限制锁」（WPS / Adobe 加的限制）<br>
      带打开密码的文件请输入密码，不会破解打开密码</div>
    </div>
    <div id="list" style="display:none"></div>
  </main>

  <footer>
    <button class="btn-ghost btn-sm" id="btn-select-all">全选</button>
    <button class="btn-ghost btn-sm" id="btn-remove-selected" disabled>移除所选</button>
    <span class="hint" id="stat"></span>
    <span class="spacer"></span>
    <button class="btn-ghost" id="btn-pick">选择文件</button>
    <button class="btn-primary" id="btn-all">全部解锁</button>
  </footer>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const files = new Map(); // path -> {info, status, password}
const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const dropzone = document.getElementById('dropzone');
const statEl = document.getElementById('stat');

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function render() {
  emptyEl.style.display = files.size ? 'none' : 'flex';
  listEl.style.display = files.size ? 'flex' : 'none';
  listEl.innerHTML = '';
  let canUnlock = 0, checked = 0;
  for (const [path, item] of files) {
    listEl.appendChild(card(item));
    if (item.checked) checked++;
    if (item.info && item.info.encrypted && !item.info.needs_password && item.status !== 'done') canUnlock++;
  }
  statEl.textContent = files.size ? `共 ${files.size} 个文件，${canUnlock} 个待解锁` : '';
  document.getElementById('btn-all').disabled = canUnlock === 0;
  document.getElementById('btn-remove-selected').disabled = checked === 0;
  document.getElementById('btn-remove-selected').textContent = `移除所选(${checked})`;
  document.getElementById('btn-select-all').textContent =
    checked === files.size && files.size > 0 ? '全不选' : '全选';
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function card(item) {
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.path = item.path || '';
  const info = item.info;
  let badge = '', meta = '', chips = '', actions = '', extra = '';

  if (!info) {
    badge = `<span class="badge gray">读取中…</span>`;
    extra = item.error ? `<div class="err">${esc(item.error)}</div>` : '';
  } else if (info.encrypted && info.needs_password) {
    badge = `<span class="badge red">🔒 需要打开密码</span>`;
    chips = `<div class="chips"><span class="chip pw">该 PDF 设置了打开密码，输入密码后才能解锁</span></div>`;
    actions = `<div class="pw-row">
      <input type="password" placeholder="输入打开密码" data-pw-input>
      <button class="btn-ghost btn-sm" data-act="retry-pw">验证</button>
    </div>`;
    if (item.error) extra = `<div class="err">${esc(item.error)}</div>`;
  } else if (info.encrypted) {
    if (item.status === 'done') {
      badge = `<span class="badge ok">✓ 已解锁</span>`;
    } else if (item.status === 'working') {
      badge = `<span class="badge gray"><span class="spin"></span> 解锁中…</span>`;
    } else {
      badge = `<span class="badge">🔐 权限受限</span>`;
    }
    meta = `<div class="meta">${info.pages} 页 · ${esc(info.algo)} · 解锁后以下限制全部放开</div>`;
    if (info.denied.length) {
      chips = `<div class="chips">` + info.denied.map(d => `<span class="chip" title="当前被权限锁禁止，解锁后放开">${esc(d)}</span>`).join('') + `</div>`;
    }
    if (item.status === 'done') {
      extra = `<div class="result-path">✓ ${esc(item.outPath || '')}</div>
        <div class="actions"><button class="btn-ghost btn-sm" data-act="open-folder" data-out="${escAttr(item.outPath || '')}">打开所在文件夹</button></div>`;
    } else if (item.status !== 'working') {
      actions = `<div class="actions"><button class="btn-primary btn-sm" data-act="unlock">解锁</button></div>`;
      if (item.error) extra = `<div class="err">${esc(item.error)}</div>`;
    }
  } else {
    badge = `<span class="badge gray">未加密，无需解锁</span>`;
    meta = `<div class="meta">${info.pages} 页</div>`;
  }

  div.innerHTML = `
    <div class="row1">
      <label class="cbx"><input type="checkbox" data-check ${item.checked ? 'checked' : ''}></label>
      <span class="fname" title="${escAttr(info ? info.path : '')}">${esc(info ? info.name : '')}</span>
      <span class="fsize">${info ? fmtSize(info.size) : ''}</span>
      <span class="spacer"></span>
      ${badge}
      <button class="btn-ghost btn-sm" data-act="remove">移除</button>
    </div>
    ${meta}${chips}${actions}${extra}`;
  return div;
}

function escAttr(s) {
  return esc(s).replace(/\\/g, '&#92;').replace(/'/g, '&#39;');
}

// ---- 事件委托：所有卡片内按钮统一处理，避免内联 onclick 的转义问题 ----
listEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const card = btn.closest('.card');
  const path = card ? card.dataset.path : '';
  const item = files.get(path);
  if (!item) return;
  const act = btn.dataset.act;

  if (act === 'remove') {
    files.delete(path);
    render();
  } else if (act === 'retry-pw') {
    const inp = card.querySelector('input[type="password"]');
    const pw = inp ? inp.value.trim() : '';
    if (!pw) return;
    try {
      const info = await invoke('inspect_pdf', { path, password: pw });
      files.set(path, { ...item, info, password: pw, error: null });
    } catch (err) {
      files.set(path, { ...item, error: String(err) });
    }
    render();
  } else if (act === 'unlock') {
    await doUnlock(path);
  } else if (act === 'open-folder') {
    invoke('open_in_explorer', { path: btn.dataset.out });
  }
});

// 密码框回车提交
listEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const inp = e.target.closest('input[type="password"]');
  if (!inp) return;
  const btn = inp.closest('.pw-row').querySelector('button[data-act="retry-pw"]');
  if (btn) btn.click();
});

// 勾选（批量移除用）
listEl.addEventListener('change', (e) => {
  const cb = e.target.closest('input[data-check]');
  if (!cb) return;
  const card = cb.closest('.card');
  const path = card ? card.dataset.path : '';
  const item = files.get(path);
  if (!item) return;
  item.checked = cb.checked;
  const removeBtn = document.getElementById('btn-remove-selected');
  let n = 0;
  for (const it of files.values()) if (it.checked) n++;
  removeBtn.disabled = n === 0;
  removeBtn.textContent = `移除所选(${n})`;
  document.getElementById('btn-select-all').textContent =
    n === files.size && files.size > 0 ? '全不选' : '全选';
});

// 全选 / 全不选
document.getElementById('btn-select-all').onclick = () => {
  const anyUnchecked = [...files.values()].some(it => !it.checked);
  for (const it of files.values()) it.checked = anyUnchecked;
  render();
};

// 批量移除所选
document.getElementById('btn-remove-selected').onclick = () => {
  for (const [path, it] of [...files]) {
    if (it.checked) files.delete(path);
  }
  render();
};

async function doUnlock(path) {
  const item = files.get(path);
  if (!item || item.status === 'working') return;
  files.set(path, { ...item, status: 'working', error: null });
  render();
  try {
    const res = await invoke('unlock_pdf', { path, password: item.password || null });
    files.set(path, { ...files.get(path), status: 'done', outPath: res.out_path });
  } catch (err) {
    files.set(path, { ...files.get(path), status: 'idle', error: String(err) });
  }
  render();
}

async function addFiles(paths) {
  const pdfs = paths.filter(p => /\.pdf$/i.test(p));
  for (const p of pdfs) {
    if (files.has(p)) continue;
    files.set(p, { path: p, info: null, status: 'idle', checked: false });
  }
  render();
  for (const p of pdfs) {
    if (!files.has(p)) continue;
    try {
      const info = await invoke('inspect_pdf', { path: p, password: null });
      files.set(p, { ...files.get(p), info });
    } catch (e) {
      files.delete(p);
    }
    render();
  }
}

document.getElementById('btn-pick').onclick = async () => {
  const picked = await invoke('pick_pdfs');
  for (const info of picked) {
    if (!files.has(info.path)) {
      files.set(info.path, { path: info.path, info, status: 'idle', checked: false });
    }
  }
  render();
};

document.getElementById('btn-all').onclick = async () => {
  for (const [path, item] of [...files]) {
    if (item.info && item.info.encrypted && !item.info.needs_password && item.status !== 'done') {
      await doUnlock(path);
    }
  }
};

// 拖拽（需 capabilities 里的 core:default 权限）
listen('tauri://drag-over', () => dropzone.classList.add('dragover'))
  .catch(err => console.error('drag-over 监听失败:', err));
listen('tauri://drag-leave', () => dropzone.classList.remove('dragover'))
  .catch(err => console.error('drag-leave 监听失败:', err));
listen('tauri://drag-drop', (e) => {
    dropzone.classList.remove('dragover');
    const payload = e.payload || {};
    const paths = payload.paths || [];
    if (paths.length) addFiles(paths);
  })
  .catch(err => console.error('drag-drop 监听失败:', err));

// 点击空白区域也可选文件
dropzone.addEventListener('click', (e) => {
  if (e.target === emptyEl || e.target.closest('#empty')) document.getElementById('btn-pick').click();
});

render();
</script>
</body>
</html>
